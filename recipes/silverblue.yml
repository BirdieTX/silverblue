---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue-test
description: Silverblue image for BirdieTX Silverblue.
base-image: ghcr.io/birdietx/base
image-version: br-testing-fp-44

modules:

  # See /files/silverblue
  - type: files
    files:
      - source: silverblue
        destination: /

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
        - com.brave.Browser
        - com.github.neithern.g4music
        - com.github.tchx84.Flatseal
        - com.mattjakeman.ExtensionManager
        - org.gnome.baobab
        - org.gnome.Calculator
        - org.gnome.Calendar
        - org.gnome.Characters
        - org.gnome.clocks
        - org.gnome.Decibels
        - org.gnome.font-viewer
        - org.gnome.Logs
        - org.gnome.Loupe
        - org.gnome.Papers
        - org.gnome.Showtime
        - org.gnome.SimpleScan
        - org.gnome.Snapshot
        - org.gnome.TextEditor
        - org.gnome.Weather
        - org.libreoffice.LibreOffice

  - type: gnome-extensions
    install:
      - Logo Menu

  # This modifies files in /usr, like desktop files and gnome extensions. They are done after installation
  # of those packages so that these can override them.
  - type: files
    files:
      - source: post-sb
        destination: /

  - type: os-release
    properties:
      PRETTY_NAME: "Fedora Linux 44 (Silverblue)"
      VERSION_CODENAME: "Bluebird"

  - type: signing
