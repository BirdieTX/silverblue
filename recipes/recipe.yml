---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue
description: Custom Silverblue image for Birdie (and friends).
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
      - ublue-os/packages
      files:
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      nonfree: negativo17
    remove:
      packages:
      - firefox
      - firefox-langpacks
      - gnome-system-monitor
      - nano-default-editor
    install:
      packages:
      - terra-release-mesa

  - type: script
    scripts:
    - priority.sh

  - type: dnf
    replace:
    - from-repo: terra-mesa
      packages:
      - mesa-dri-drivers
      - mesa-filesystem
      - mesa-libEGL
      - mesa-libGL
      - mesa-libgbm
      - mesa-vulkan-drivers

  - type: dnf
    remove:
      auto-remove: true
      packages:
      - gnome-shell-extension-apps-menu
      - gnome-shell-extension-background-logo
      - gnome-shell-extension-common
      - gnome-shell-extension-launch-new-instance
      - gnome-shell-extension-places-menu
      - gnome-shell-extension-window-list

  - type: dnf
    install:
      packages:
      - alacritty
      - arimo-nerd-fonts
      - bibata-cursor-theme
      - btop
      - cargo
      - cmatrix
      - eza
      - fastfetch
      - fish
      - gnome-rounded-blur
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-blur-my-shell
      - gnome-shell-extension-caffeine
      - gnome-shell-extension-dash-to-dock
      - gnome-shell-extension-gsconnect
      - gnome-shell-extension-just-perfection
      - google-arimo-fonts
      - google-droid-fonts-all
      - google-go-fonts
      - google-noto-fonts-all
      - google-noto-sans-hk-fonts
      - google-noto-serif-cjk-fonts
      - google-roboto-fonts
      - google-roboto-mono-fonts
      - google-roboto-slab-fonts
      - google-rubik-fonts
      - HandBrake-cli
      - jetbrains-mono-fonts-all
      - jetbrainsmono-nerd-fonts
      - kf6-kirigami-addons
      - material-icons-fonts
      - papirus-icon-theme
      - plasma-breeze
      - qt5ct
      - qt6ct
      - rsms-inter-fonts
      - rsms-inter-vf-fonts
      - rust
      - satty
      - setroubleshoot
      - signal-cli
      - starship
      - terminus-fonts
      - terminus-fonts-console
      - vim-default-editor
      - yazi
      - yt-dlp
      - zsh
      - zsh-autocomplete
      - zsh-autosuggestions
      - zsh-html
      - zsh-syntax-highlighting

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
        - com.brave.Browser
        - com.github.neithern.g4music
        - com.github.tchx84.Flatseal
        - com.mattjakeman.ExtensionManager
        - com.saivert.pwvucontrol
        - com.vixalien.sticky
        - io.missioncenter.MissionCenter
        - org.gnome.baobab
        - org.gnome.Calculator
        - org.gnome.Calendar
        - org.gnome.Characters
        - org.gnome.clocks
        - org.gnome.Decibels
        - org.gnome.font-viewer
        - org.gnome.Logs
        - org.gnome.Loupe
        - org.gnome.Papers
        - org.gnome.Showtime
        - org.gnome.SimpleScan
        - org.gnome.Snapshot
        - org.gnome.TextEditor
        - org.gnome.Weather
        - org.libreoffice.LibreOffice

  - type: gnome-extensions
    install:
      - Alphabetical App Grid
      - Keep pinned apps in AppGrid
      - Logo Menu
      - Tiling Assistant

  - type: systemd
    system:
      disable:
        - NetworkManager-wait-online.service
      enabled:
        - bluebird-auto-update.timer
        - grub-config.service
      masked:
        - bootc-fetch-apply-updates.timer
        - rpm-ostreed-automatic.timer

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: false
    update-interval: 7d
    update-wait-after-boot: 10m
    upgrade-interval: 7d
    upgrade-wait-after-boot: 30m

  - type: script
    scripts:
    - gshell.sh
    - post.sh

  - type: dnf
    repos:
      disable:
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        disable:
          - ublue-os/bazzite
          - ublue-os/bazzite-multilib
          - ublue-os/packages
          - ublue-os/staging

  - type: gschema-overrides
    include:
      - zz1-bluebird.gschema.override

  - type: bling
    install:
      - dconf-update-service

  - type: files
    files:
      - source: post
        destination: /

  - type: os-release
    properties:
      PRETTY_NAME="Fedora Linux 44 (Silverblue)"
      VERSION_CODENAME="Bluebird"

  - type: initramfs
  - type: signing
