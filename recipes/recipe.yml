---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue
description: Custom Silverblue image.
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: 44

modules:

  # See /files/system
  - type: files
    files:
      - source: system
        destination: /

  # Enables ublue packages, brave, terra and negativo17
  - type: dnf
    repos:
      copr:
      - ublue-os/packages
      files:
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      - https://negativo17.org/repos/fedora-multimedia.repo
      - https://negativo17.org/repos/fedora-rar.repo

  # Addes repo for updates mesa drivers, removes debug and source repos, removes unneeded packages
  - type: dnf
    install:
      packages:
        - terra-release-mesa
    repos:
      disable:
        - fedora-multimedia-debug
        - fedora-multimedia-source
        - fedora-rar-debug
        - fedora-rar-source
    remove:
      auto-remove: true
      packages:
        - firefox
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-common
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - nano-default-editor

  # Sets priority levels for dnf repos
  - type: script
    scripts:
      - dnf.sh
    snippets:
      - "dnf5 upgrade --allow-vendor-change --assumeyes --refresh"

# The dnf modules are broken up into chunks in an attempt keep each layer under 1 GiB.Sometimes
# it is not possible to keep each layer under 1 GiB if a package being installed is over 1 GiB.
# In that case, those package get installed last, which can sometimes help lower the installation
# size if some package dependencies are already installed in an earlier layer. Installation sizes
# can vary between updates, so these should be checked and changed frequently if needed.

  # 703 MiB
  - type: dnf
    install:
      packages:
        - alacritty
        - arimo-nerd-fonts
        - baobab
        - bat
        - bibata-cursor-theme
        - brave-browser
        - btop

  - type: dnf
    install:
      packages:
        - cargo
        - cmatrix
        - decibels
        - eza
        - fastfetch
        - fish
        - flatseal
        - g4music
        - google-arimo-fonts
        - google-droid-fonts-all
        - google-go-fonts
        - google-noto-fonts-all

  - type: dnf
    install:
      packages:
        - google-noto-sans-hk-fonts
        - google-noto-serif-cjk-fonts
        - google-roboto-fonts
        - google-roboto-mono-fonts
        - google-roboto-slab-fonts
        - google-rubik-fonts
        - gnome-boxes
        - gnome-calculator
        - gnome-calendar
        - gnome-characters
        - gnome-clocks
        - gnome-connections
        - gnome-font-viewer
        - gnome-logs
        - gnome-maps
        - gnome-rounded-blur
        - gnome-shell-extension-blur-my-shell
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-caffeine
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-gsconnect
        - gnome-shell-extension-just-perfection
        - gnome-text-editor
        - gnome-weather
        - HandBrake-cli
        - jetbrains-mono-fonts-all
        - jetbrainsmono-nerd-fonts
        - kf6-kirigami-addons

  - type: dnf
    install:
      packages:
        - libreoffice-base
        - libreoffice-calc
        - libreoffice-draw
        - libreoffice-impress
        - libreoffice-math
        - libreoffice-writer
        - loupe
        - material-icons-fonts
        - mc
        - mission-center
        - papers
        - papirus-icon-theme

  - type: dnf
    install:
      packages:
        - plasma-breeze
        - qt5ct
        - qt6ct
        - rar
        - rsms-inter-fonts
        - rsms-inter-vf-fonts
        - rust
        - setroubleshoot
        - showtime
        - signal-cli
        - simple-scan
        - snapshot
        - starship
        - terminus-fonts
        - terminus-fonts-console
        - vim-default-editor
        - yazi
        - yt-dlp
        - zsh
        - zsh-autocomplete
        - zsh-autosuggestions
        - zsh-html
        - zsh-syntax-highlighting

  # Most of these are either not available in any repositories or are not well-supported outside flathub.
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
        - com.mattjakeman.ExtensionManager
        - com.saivert.pwvucontrol
        - com.vixalien.sticky

  # DING cannot be installed in this module. Needs to be installed by the end user.
  - type: gnome-extensions
    install:
      - Alphabetical App Grid
      - Keep pinned apps in AppGrid
      - Logo Menu
      - Tiling Assistant

  # NetworkManager-wait-online.service slows down boot time and is not needed for any of my own use cases.
  # Other systemd modules are either unique to my images or are modified.
  - type: systemd
    system:
      disable:
        - NetworkManager-wait-online.service
      enabled:
        - bluebird-auto-update.timer
        - grub-config.service
      masked:
        - bootc-fetch-apply-updates.timer
        - rpm-ostreed-automatic.timer

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: false
    update-interval: 7d
    update-wait-after-boot: 10m
    upgrade-interval: 7d
    upgrade-wait-after-boot: 30m

  # Changes dconf settings that the gschema override module can't do. The first snippet removes the banner
  # for upgrading Fedora versions and the plymouth theme is a modified bgrt-mac-style theme with the
  # Fedora logo restored on it as it is in the spinner theme.
  - type: script
    scripts:
      - gshell.sh
    snippets:
      - "rm -f /usr/lib64/gnome-software/plugins-*/libgs_plugin_fedora-pkgdb-collections.so"
      - "plymouth-set-default-theme bgrt-mac-style"

  # This keeps end users from layering packages which breaks automated updates. Package layering is
  # still possible, but this forces the end user to enable the repositories needed to do it. Package
  # layering is not recommended in general. Custom images should be used instead. Package layering
  # should be considered for testing use cases only.
  - type: dnf
    repos:
      disable:
        - brave-browser
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - fedora-rar
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        disable:
          - ublue-os/packages

  - type: gschema-overrides
    include:
      - zz1-bluebird.gschema.override

  - type: bling
    install:
      - dconf-update-service

  # This modifies files in /usr, like desktop files and gnome extensions. They are done after installation
  # of those packages so that these can override them.
  - type: files
    files:
      - source: post
        destination: /

  - type: os-release
    properties:
      PRETTY_NAME: "Fedora Linux 44 (Silverblue)"
      VERSION_CODENAME: "Bluebird"

  # initramfs is needed to apply the plymouth theme (properly).
  - type: initramfs
  - type: signing
