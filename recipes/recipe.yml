---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue
description: Custom Silverblue image for Birdie (and friends).
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
      - ublue-os/packages
      files:
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      nonfree: negativo17
    remove:
      packages:
      - firefox
      - firefox-langpacks
      - gnome-system-monitor
      - nano-default-editor
    install:
      packages:
      - terra-release-mesa

  - type: script
    scripts:
      - dnf.sh
    snippets:
      - "dnf5 upgrade --allow-vendor-change --assumeyes --refresh"
  - type: dnf
    repos:
      disable:
        - fedora-cdrtools
        - fedora-cdrtools-source
        - fedora-cdrtools-debug
        - fedora-multimedia-source
        - fedora-multimedia-debug
        - fedora-nvidia
        - fedora-nvidia-source
        - fedora-nvidia-debug
        - fedora-rar-source
        - fedora-rar-debug
        - fedora-spotify
        - fedora-spotify-source
        - fedora-spotify-debug
        - fedora-steam
        - fedora-steam-source
        - fedora-steam-debug
        - fedora-uld
        - fedora-uld-source
        - fedora-uld-debug

  - type: dnf
    remove:
      auto-remove: true
      packages:
      - gnome-shell-extension-apps-menu
      - gnome-shell-extension-background-logo
      - gnome-shell-extension-common
      - gnome-shell-extension-launch-new-instance
      - gnome-shell-extension-places-menu
      - gnome-shell-extension-window-list

  # CLI TOOLS
  - type: dnf
    install:
      packages:
        - btop
        - cargo
        - cmatrix
        - eza
        - fastfetch
        - HandBrake-cli
        - mc
        - rar
        - rust
        - signal-cli
        - vim-default-editor
        - yazi
        - yt-dlp

  # ENVIRONMENT
  - type: dnf
    install:
      packages:
        - bibata-cursor-theme
        - kf6-kirigami-addons
        - papirus-icon-theme
        - plasma-breeze
        - qt5ct
        - qt6ct

  # FONTS
  - type: dnf
    install:
      packages:
        - arimo-nerd-fonts
        - google-arimo-fonts
        - google-droid-fonts-all
        - google-go-fonts
        - google-noto-fonts-all
        - google-noto-sans-hk-fonts
        - google-noto-serif-cjk-fonts
        - google-roboto-fonts
        - google-roboto-mono-fonts
        - google-roboto-slab-fonts
        - google-rubik-fonts
        - jetbrains-mono-fonts-all
        - jetbrainsmono-nerd-fonts
        - material-icons-fonts
        - rsms-inter-fonts
        - rsms-inter-vf-fonts
        - terminus-fonts
        - terminus-fonts-console

  # GNOME EXTENSIONS (FROM DNF)
  - type: dnf
    install:
      packages:
        - gnome-rounded-blur
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-blur-my-shell
        - gnome-shell-extension-caffeine
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-gsconnect
        - gnome-shell-extension-just-perfection

  # GUI APPLICATIONS
  - type: dnf
    install:
      packages:
        - baobab
        - brave-browser
        - decibels
        - flatseal
        - g4music
        - gnome-calculator
        - gnome-calendar
        - gnome-characters
        - gnome-clocks
        - gnome-font-viewer
        - gnome-logs
        - gnome-text-editor
        - gnome-weather
        - libreoffice-base
        - libreoffice-calc
        - libreoffice-draw
        - libreoffice-impress
        - libreoffice-math
        - libreoffice-writer
        - loupe
        - mission-center
        - papers
        - setroubleshoot
        - showtime
        - simple-scan
        - snapshot

  # TERMINAL
  - type: dnf
    install:
      packages:
        - alacritty
        - fish
        - starship
        - zsh
        - zsh-autocomplete
        - zsh-autosuggestions
        - zsh-html
        - zsh-syntax-highlighting

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
        - com.mattjakeman.ExtensionManager
        - com.saivert.pwvucontrol
        - com.vixalien.sticky

  - type: gnome-extensions
    install:
      - Alphabetical App Grid
      - Keep pinned apps in AppGrid
      - Logo Menu
      - Tiling Assistant

  - type: systemd
    system:
      disable:
        - NetworkManager-wait-online.service
      enabled:
        - bluebird-auto-update.timer
        - grub-config.service
      masked:
        - bootc-fetch-apply-updates.timer
        - rpm-ostreed-automatic.timer

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: false
    update-interval: 7d
    update-wait-after-boot: 10m
    upgrade-interval: 7d
    upgrade-wait-after-boot: 30m

  - type: script
    scripts:
      - gshell.sh
    snippets:
      - "rm -f /usr/lib64/gnome-software/plugins-*/libgs_plugin_fedora-pkgdb-collections.so"
      - "plymouth-set-default-theme bgrt-mac-style"

  - type: dnf
    repos:
      disable:
        - brave-browser
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        disable:
          - ublue-os/packages
          - ublue-os/staging

  - type: gschema-overrides
    include:
      - zz1-bluebird.gschema.override

  - type: bling
    install:
      - dconf-update-service

  - type: files
    files:
      - source: post
        destination: /

  - type: os-release
    properties:
      PRETTY_NAME: "Fedora Linux 44 (Silverblue)"
      VERSION_CODENAME: "Bluebird"

  - type: initramfs
  - type: signing
